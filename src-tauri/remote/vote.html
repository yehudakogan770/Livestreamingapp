<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1114" />
    <link rel="icon" href="data:," />
    <title>Join in</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1114;
        --card: #1a1d22;
        --line: #2b3038;
        --text: #f2f3f5;
        --dim: #9aa0a8;
        --accent: #2f80ed;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font: 17px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 24px 16px 40px;
      }
      h1 {
        margin: 0 0 18px;
        font-size: 24px;
        line-height: 1.25;
      }
      .poll + .poll {
        margin-top: 32px;
        padding-top: 24px;
        border-top: 1px solid var(--line);
      }
      button {
        display: block;
        width: 100%;
        margin: 0 0 10px;
        padding: 16px;
        border: 2px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        color: var(--text);
        font: inherit;
        font-weight: 600;
        text-align: left;
        cursor: pointer;
      }
      button.is-mine {
        border-color: var(--accent);
        background: #16263d;
      }
      button.is-mine::after {
        content: ' ✓';
        color: var(--accent);
      }
      .note {
        color: var(--dim);
        font-size: 14px;
      }
      input,
      textarea {
        width: 100%;
        margin: 0 0 10px;
        padding: 14px;
        border: 2px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        color: var(--text);
        font: inherit;
      }
      textarea {
        min-height: 110px;
        resize: vertical;
      }
      .send {
        background: var(--accent);
        border-color: var(--accent);
        text-align: center;
      }
      .event {
        margin: 0 0 20px;
        color: var(--dim);
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .file {
        display: none;
      }
      .pick {
        display: block;
        margin: 0 0 10px;
        padding: 14px;
        border: 2px dashed var(--line);
        border-radius: 12px;
        text-align: center;
        font-weight: 600;
        cursor: pointer;
      }
      .photo {
        display: block;
        max-width: 100%;
        max-height: 50vh;
        margin: 0 auto 10px;
        border-radius: 12px;
      }
      button:disabled {
        opacity: 0.6;
      }
      .empty {
        margin-top: 30vh;
        text-align: center;
        color: var(--dim);
      }
    </style>
  </head>
  <body>
    <main id="app"><p class="empty">Waiting for a question…</p></main>
    <script>
      // Each phone is one voter (a random name kept on the phone).
      let voter = '';
      try {
        voter = localStorage.getItem('lumora.voter') || '';
        if (!voter) {
          voter = Math.random().toString(36).slice(2) + Date.now().toString(36);
          localStorage.setItem('lumora.voter', voter);
        }
      } catch {
        voter = Math.random().toString(36).slice(2);
      }
      const mine = {};
      const app = document.getElementById('app');
      let last = '';

      // What the person has typed stays while the page redraws.
      const typed = { name: '', question: '' };
      try {
        typed.name = localStorage.getItem('lumora.name') || '';
      } catch {}
      let sentNote = '';

      function el(tag, props, ...kids) {
        const e = document.createElement(tag);
        Object.assign(e, props || {});
        e.append(...kids);
        return e;
      }

      function nameBox() {
        const i = el('input', { placeholder: 'Your name', value: typed.name, maxLength: 40, autocomplete: 'name' });
        i.oninput = () => {
          typed.name = i.value;
          try {
            localStorage.setItem('lumora.name', i.value);
          } catch {}
        };
        return i;
      }

      function draw(a) {
        const key = JSON.stringify(a) + JSON.stringify(mine) + sentNote + pledgeNote + JSON.stringify(joined) + wallNote + (photo ? photo.size : '') + sending;
        if (key === last) return;
        // Never redraw under someone typing.
        if (document.activeElement && ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
        last = key;
        app.textContent = '';
        if (a.event) app.append(el('p', { className: 'event', textContent: a.event }));
        const raffles = a.raffles || [];
        const funds = a.fundraisers || [];
        const walls = a.walls || [];
        const open = a.polls.length || a.questions || raffles.length || funds.length || walls.length;
        if (!open) {
          app.append(el('p', { className: 'empty', textContent: 'Nothing to join right now — this page updates by itself.' }));
          return;
        }
        for (const poll of a.polls) {
          const box = el('section', { className: 'poll' }, el('h1', { textContent: poll.question }));
          const chosen = mine[poll.id + ':' + poll.round];
          poll.options.forEach((text, i) => {
            const b = el('button', { textContent: text, className: chosen === i ? 'is-mine' : '' });
            b.onclick = () => vote(poll, i);
            box.append(b);
          });
          box.append(el('p', { className: 'note', textContent: chosen === undefined ? 'Tap your answer.' : 'Thank you! You can change your answer while voting is open.' }));
          app.append(box);
        }
        for (const r of raffles) {
          const box = el('section', { className: 'poll' }, el('h1', { textContent: r.title || 'Raffle' }));
          if (r.prize) box.append(el('p', { className: 'note', textContent: 'Prize: ' + r.prize }));
          if (joined[r.id]) {
            box.append(el('p', { textContent: "You're in, " + joined[r.id] + '! Good luck.' }));
          } else {
            const go = el('button', { className: 'send', textContent: 'Enter the raffle' });
            go.onclick = () => enter(r);
            box.append(nameBox(), go);
          }
          app.append(box);
        }
        for (const f of funds) {
          const amount = el('input', { type: 'number', inputMode: 'numeric', min: 1, placeholder: 'Amount (' + (f.currency || '') + ')', value: typed.amount });
          amount.oninput = () => (typed.amount = amount.value);
          const msg = el('input', { placeholder: 'A message (optional)', value: typed.message, maxLength: 140 });
          msg.oninput = () => (typed.message = msg.value);
          const go = el('button', { className: 'send', textContent: 'Pledge' });
          go.onclick = () => pledgeIt(f);
          app.append(
            el('section', { className: 'poll' }, el('h1', { textContent: f.title || 'Fundraiser' }), nameBox(), amount, msg, go,
              el('p', { className: 'note', textContent: pledgeNote || 'A pledge is a promise: the hosts will tell you how to give.' })),
          );
        }
        for (const w of walls) {
          const text = el('textarea', { placeholder: 'Your message', value: typed.wall, maxLength: 280, dir: 'auto' });
          text.oninput = () => (typed.wall = text.value);
          const box = el('section', { className: 'poll' }, el('h1', { textContent: w.prompt || w.title || 'Send a message', dir: 'auto' }), nameBox(), text);
          if (w.photos) {
            if (photo) {
              const img = el('img', { src: photoUrl, className: 'photo', alt: '' });
              const off = el('button', { textContent: 'Remove the photo' });
              off.onclick = () => {
                setPhoto(null);
                last = '';
                load();
              };
              box.append(img, off);
            } else {
              const pick = el('input', { type: 'file', accept: 'image/*', className: 'file', id: 'photo-' + w.id });
              pick.onchange = async () => {
                const f = pick.files && pick.files[0];
                if (f) setPhoto(await shrink(f));
                if (document.activeElement) document.activeElement.blur();
                last = '';
                load();
              };
              box.append(el('label', { className: 'pick', htmlFor: 'photo-' + w.id, textContent: '📷 Add a photo' }), pick);
            }
          }
          const send = el('button', { className: 'send', textContent: sending ? 'Sending…' : 'Send', disabled: sending });
          send.onclick = () => sendMessage(w);
          box.append(send, el('p', { className: 'note', textContent: wallNote || 'The hosts choose what goes on screen.' }));
          app.append(box);
        }
        if (a.questions) {
          const q = el('textarea', { placeholder: 'Your question', value: typed.question, maxLength: 300 });
          q.oninput = () => (typed.question = q.value);
          const send = el('button', { className: 'send', textContent: 'Send the question' });
          send.onclick = () => askIt();
          app.append(el('section', { className: 'poll' }, el('h1', { textContent: 'Ask a question' }), nameBox(), q, send, el('p', { className: 'note', textContent: sentNote || 'The hosts choose which questions go on screen.' })));
        }
      }

      const joined = {};
      typed.amount = '';
      typed.message = '';
      let pledgeNote = '';

      async function enter(r) {
        const name = typed.name.trim();
        if (!name) return alert('Please type your name first.');
        try {
          const res = await fetch('/api/raffle', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: r.id, name, voter }),
          });
          if (!res.ok) throw new Error();
          joined[r.id] = name;
        } catch {
          alert('It did not go through — try again.');
        }
        last = '';
        load();
      }

      async function pledgeIt(f) {
        const amount = Math.floor(Number(typed.amount));
        if (!(amount > 0)) return alert('Please type an amount.');
        try {
          const res = await fetch('/api/pledge', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: f.id, name: typed.name.trim(), amount, message: typed.message.trim(), voter }),
          });
          if (res.status === 429) pledgeNote = 'Please wait a few seconds before pledging again.';
          else if (!res.ok) throw new Error();
          else {
            pledgeNote = 'Thank you for your pledge of ' + (f.currency || '') + amount.toLocaleString() + '!';
            typed.amount = '';
            typed.message = '';
          }
        } catch {
          pledgeNote = 'It did not go through — try again.';
        }
        if (document.activeElement) document.activeElement.blur();
        last = '';
        load();
      }

      typed.wall = '';
      let wallNote = '';
      let photo = null;
      let photoUrl = '';
      let sending = false;

      function setPhoto(blob) {
        if (photoUrl) URL.revokeObjectURL(photoUrl);
        photo = blob;
        photoUrl = blob ? URL.createObjectURL(blob) : '';
      }

      // Photos are made smaller on the phone (quicker to send, easy on the venue network).
      async function shrink(file) {
        try {
          const url = URL.createObjectURL(file);
          const img = await new Promise((ok, fail) => {
            const i = new Image();
            i.onload = () => ok(i);
            i.onerror = fail;
            i.src = url;
          });
          URL.revokeObjectURL(url);
          const scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
          const c = document.createElement('canvas');
          c.width = Math.round(img.naturalWidth * scale);
          c.height = Math.round(img.naturalHeight * scale);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          return await new Promise((ok) => c.toBlob(ok, 'image/jpeg', 0.85));
        } catch {
          alert('That picture could not be opened — try another.');
          return null;
        }
      }

      async function sendMessage(w) {
        const text = typed.wall.trim();
        if (!text && !photo) return alert('Please write a message' + (w.photos ? ' or add a photo.' : '.'));
        const q = new URLSearchParams({ id: w.id, voter, name: typed.name.trim(), text });
        sending = true;
        last = '';
        load();
        try {
          const r = await fetch('/api/message?' + q, { method: 'POST', headers: { 'Content-Type': 'image/jpeg' }, body: photo || '' });
          if (r.status === 429) wallNote = 'Please wait a few seconds before sending another.';
          else if (!r.ok) throw new Error();
          else {
            typed.wall = '';
            setPhoto(null);
            wallNote = 'Thank you — your message was sent!';
          }
        } catch {
          wallNote = 'It did not send — try again.';
        }
        sending = false;
        if (document.activeElement) document.activeElement.blur();
        last = '';
        load();
      }

      async function askIt() {
        const text = typed.question.trim();
        if (!text) return;
        try {
          const r = await fetch('/api/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ author: typed.name.trim(), text, voter }),
          });
          if (r.status === 429) sentNote = 'Please wait a few seconds before sending another question.';
          else if (!r.ok) throw new Error();
          else {
            typed.question = '';
            sentNote = 'Thank you — your question was sent.';
          }
        } catch {
          sentNote = 'It did not send — try again.';
        }
        if (document.activeElement) document.activeElement.blur();
        last = '';
        load();
      }

      async function load() {
        try {
          const r = await fetch('/api/audience', { cache: 'no-store' });
          if (r.ok) draw(await r.json());
        } catch {
          // The venue network dropped for a moment; try again.
        }
      }

      async function vote(poll, option) {
        const k = poll.id + ':' + poll.round;
        const before = mine[k];
        mine[k] = option;
        load();
        try {
          const r = await fetch('/api/vote', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: poll.id, round: poll.round, option, voter }),
          });
          if (!r.ok) throw new Error();
        } catch {
          mine[k] = before;
          last = '';
          load();
        }
      }

      load();
      setInterval(load, 2000);
    </script>
  </body>
</html>
