<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1114" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M25.65 3.06A21 21 0 0 1 42.95 33.04L29.01 33.23A10.5 10.5 0 0 0 30.82 16.02Z' fill='%234fb3bf'/%3E%3Cpath d='M41.31 35.89A21 21 0 0 1 6.69 35.89L13.5 23.73A10.5 10.5 0 0 0 27.5 33.9Z' fill='%23d6d8dc'/%3E%3Cpath d='M5.05 33.04A21 21 0 0 1 22.35 3.06L29.49 15.05A10.5 10.5 0 0 0 13.68 22.09Z' fill='%238f949c'/%3E%3Ccircle cx='24' cy='24' r='5.6' fill='%23e0473b'/%3E%3C/svg%3E"
    />
    <title>Join in</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1114;
        --card: #1a1d22;
        --line: #2b3038;
        --text: #f2f3f5;
        --dim: #9aa0a8;
        --accent: #2f80ed;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font:
          17px/1.4 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 24px 16px 40px;
      }
      h1 {
        margin: 0 0 18px;
        font-size: 24px;
        line-height: 1.25;
      }
      .poll + .poll {
        margin-top: 32px;
        padding-top: 24px;
        border-top: 1px solid var(--line);
      }
      button {
        display: block;
        width: 100%;
        margin: 0 0 10px;
        padding: 16px;
        border: 2px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        color: var(--text);
        font: inherit;
        font-weight: 600;
        text-align: left;
        cursor: pointer;
      }
      button.is-mine {
        border-color: var(--accent);
        background: #16263d;
      }
      button.is-mine::after {
        content: ' ✓';
        color: var(--accent);
      }
      .note {
        color: var(--dim);
        font-size: 14px;
      }
      input,
      textarea {
        width: 100%;
        margin: 0 0 10px;
        padding: 14px;
        border: 2px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        color: var(--text);
        font: inherit;
      }
      textarea {
        min-height: 110px;
        resize: vertical;
      }
      .send {
        background: var(--accent);
        border-color: var(--accent);
        text-align: center;
      }
      .event {
        margin: 0 0 20px;
        color: var(--dim);
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .file {
        display: none;
      }
      .pick {
        display: block;
        margin: 0 0 10px;
        padding: 14px;
        border: 2px dashed var(--line);
        border-radius: 12px;
        text-align: center;
        font-weight: 600;
        cursor: pointer;
      }
      .photo {
        display: block;
        max-width: 100%;
        max-height: 50vh;
        margin: 0 auto 10px;
        border-radius: 12px;
      }
      button:disabled {
        opacity: 0.6;
      }
      .seat {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin: 0 0 8px;
        padding: 14px;
        border-radius: 12px;
        background: var(--card);
        font-size: 18px;
      }
      .seat b {
        color: #f2b233;
        white-space: nowrap;
      }
      .answer {
        border: 0;
        color: #fff;
        font-size: 20px;
        padding: 20px 16px;
      }
      .big-note {
        font-size: 22px;
        font-weight: 700;
      }
      .big {
        margin: 0 0 6px;
        font-size: 40px;
        font-weight: 800;
      }
      .winning {
        color: #f2b233;
        font-weight: 700;
      }
      .timer {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 999px;
        background: var(--card);
        font-weight: 800;
      }
      .timer.late {
        background: #e0473b;
      }
      .empty {
        margin-top: 30vh;
        text-align: center;
        color: var(--dim);
      }
      .brandbar {
        display: flex;
        align-items: center;
        gap: 8px;
        max-width: 560px;
        margin: 0 auto;
        padding: 14px 16px 0;
        color: var(--dim);
        font-size: 14px;
        font-weight: 600;
      }
      .brandbar svg {
        width: 20px;
        height: 20px;
        flex: none;
      }
    </style>
  </head>
  <body>
    <header class="brandbar">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path d="M25.65 3.06 A21 21 0 0 1 42.95 33.04 L29.01 33.23 A10.5 10.5 0 0 0 30.82 16.02 Z" fill="#4fb3bf" />
        <path d="M41.31 35.89 A21 21 0 0 1 6.69 35.89 L13.50 23.73 A10.5 10.5 0 0 0 27.50 33.90 Z" fill="#d6d8dc" />
        <path d="M5.05 33.04 A21 21 0 0 1 22.35 3.06 L29.49 15.05 A10.5 10.5 0 0 0 13.68 22.09 Z" fill="#8f949c" />
        <circle cx="24" cy="24" r="5.6" fill="#e0473b" />
      </svg>
      Lumora
    </header>
    <main id="app"><p class="empty">Waiting for a question…</p></main>
    <script>
      // Each phone is one voter (a random name kept on the phone).
      let voter = '';
      try {
        voter = localStorage.getItem('lumora.voter') || '';
        if (!voter) {
          voter = Math.random().toString(36).slice(2) + Date.now().toString(36);
          localStorage.setItem('lumora.voter', voter);
        }
      } catch {
        voter = Math.random().toString(36).slice(2);
      }
      const mine = {};
      const app = document.getElementById('app');
      let last = '';

      // What the person has typed stays while the page redraws.
      const typed = { name: '', question: '' };
      try {
        typed.name = localStorage.getItem('lumora.name') || '';
      } catch {}
      let sentNote = '';

      function el(tag, props, ...kids) {
        const e = document.createElement(tag);
        Object.assign(e, props || {});
        e.append(...kids);
        return e;
      }

      function nameBox() {
        const i = el('input', { placeholder: 'Your name', value: typed.name, maxLength: 40, autocomplete: 'name' });
        i.oninput = () => {
          typed.name = i.value;
          try {
            localStorage.setItem('lumora.name', i.value);
          } catch {}
        };
        return i;
      }

      function draw(a) {
        const key =
          JSON.stringify({ ...a, now: 0 }) +
          JSON.stringify(myBids) +
          bidNote +
          JSON.stringify(mine) +
          sentNote +
          pledgeNote +
          JSON.stringify(joined) +
          wallNote +
          (photo ? photo.size : '') +
          sending;
        if (key === last) return;
        // Never redraw under someone typing.
        if (document.activeElement && ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
        last = key;
        app.textContent = '';
        if (a.event) app.append(el('p', { className: 'event', textContent: a.event }));
        const raffles = a.raffles || [];
        const funds = a.fundraisers || [];
        const walls = a.walls || [];
        const auctions = a.auctions || [];
        const games = a.trivia || [];
        const seating = a.seating || [];
        if (a.now) clockOffset = a.now - Date.now();
        timers.length = 0;
        const open = a.polls.length || a.questions || raffles.length || funds.length || walls.length || auctions.length || games.length || seating.length;
        if (!open) {
          app.append(el('p', { className: 'empty', textContent: 'Nothing to join right now — this page updates by itself.' }));
          return;
        }
        for (const poll of a.polls) {
          const box = el('section', { className: 'poll' }, el('h1', { textContent: poll.question }));
          const chosen = mine[poll.id + ':' + poll.round];
          poll.options.forEach((text, i) => {
            const b = el('button', { textContent: text, className: chosen === i ? 'is-mine' : '' });
            b.onclick = () => vote(poll, i);
            box.append(b);
          });
          box.append(
            el('p', {
              className: 'note',
              textContent: chosen === undefined ? 'Tap your answer.' : 'Thank you! You can change your answer while voting is open.',
            }),
          );
          app.append(box);
        }
        for (const r of raffles) {
          const box = el('section', { className: 'poll' }, el('h1', { textContent: r.title || 'Raffle' }));
          if (r.prize) box.append(el('p', { className: 'note', textContent: 'Prize: ' + r.prize }));
          if (joined[r.id]) {
            box.append(el('p', { textContent: "You're in, " + joined[r.id] + '! Good luck.' }));
          } else {
            const go = el('button', { className: 'send', textContent: 'Enter the raffle' });
            go.onclick = () => enter(r);
            box.append(nameBox(), go);
          }
          app.append(box);
        }
        for (const f of funds) {
          const amount = el('input', { type: 'number', inputMode: 'numeric', min: 1, placeholder: 'Amount (' + (f.currency || '') + ')', value: typed.amount });
          amount.oninput = () => (typed.amount = amount.value);
          const msg = el('input', { placeholder: 'A message (optional)', value: typed.message, maxLength: 140 });
          msg.oninput = () => (typed.message = msg.value);
          const go = el('button', { className: 'send', textContent: 'Pledge' });
          go.onclick = () => pledgeIt(f);
          app.append(
            el(
              'section',
              { className: 'poll' },
              el('h1', { textContent: f.title || 'Fundraiser' }),
              nameBox(),
              amount,
              msg,
              go,
              el('p', { className: 'note', textContent: pledgeNote || 'A pledge is a promise: the hosts will tell you how to give.' }),
            ),
          );
        }
        for (const st of seating) {
          const box = el('section', { className: 'poll' }, el('h1', { textContent: st.title || 'Find your seat', dir: 'auto' }));
          const q = el('input', { placeholder: 'Type your name', value: typed.seat, dir: 'auto', autocomplete: 'name' });
          q.oninput = () => {
            typed.seat = q.value;
            clearTimeout(seatTimer);
            seatTimer = setTimeout(() => findSeat(st, box), 350);
          };
          box.append(q, el('div', { className: 'seats' }));
          app.append(box);
          if (typed.seat.trim().length >= 2) findSeat(st, box);
        }
        const LOOK = [
          ['#e0473b', '▲'],
          ['#2f80ed', '◆'],
          ['#d9a21b', '●'],
          ['#27ae60', '■'],
        ];
        for (const g of games) {
          const box = el('section', { className: 'poll' }, el('p', { className: 'event', textContent: g.title || 'Trivia' }));
          const mark = (i) => LOOK[i][1] + ' ' + (g.options ? g.options[i] : '');
          const standing = g.place ? 'You are #' + g.place + ' with ' + Number(g.score).toLocaleString() + ' points.' : '';
          if (g.phase === 'join' || !g.options) {
            box.append(
              el('h1', { textContent: 'Get ready to play!' }),
              el('p', { className: 'note', textContent: 'Type your name — the first question is coming.' }),
              nameBox(),
            );
          } else if (g.phase === 'asking') {
            box.append(el('h1', { textContent: g.text, dir: 'auto' }));
            if (g.answered !== null && g.answered !== undefined) {
              box.append(
                el('p', { className: 'big-note', textContent: 'Answer in: ' + mark(g.answered) }),
                el('p', { className: 'note', textContent: 'Wait for the answer on the screen…' }),
              );
            } else if (!g.taking) {
              box.append(el('p', { className: 'big-note', textContent: "Time's up!" }));
            } else {
              if (!typed.name.trim()) box.append(nameBox());
              g.options.forEach((o, i) => {
                const b = el('button', { className: 'answer', textContent: LOOK[i][1] + '  ' + o, dir: 'auto' });
                b.style.background = LOOK[i][0];
                b.onclick = () => answerIt(g, i);
                box.append(b);
              });
            }
          } else if (g.phase === 'reveal') {
            const right = g.answered === g.correct;
            box.append(
              el('h1', {
                textContent:
                  g.answered === null || g.answered === undefined ? 'The answer: ' + mark(g.correct) : right ? '✓ Right! +' + g.points : '✗ Not this time',
                dir: 'auto',
              }),
              el('p', {
                className: 'note',
                textContent: (right || g.answered === null || g.answered === undefined ? '' : 'The answer was ' + mark(g.correct) + '. ') + standing,
              }),
            );
          } else {
            box.append(
              el('h1', { textContent: g.place ? '🏆 You are #' + g.place : '🏆 Leaderboard on the screen' }),
              el('p', { className: 'note', textContent: standing }),
            );
          }
          app.append(box);
        }
        for (const au of auctions) {
          const it = au.item;
          const money = (n) => (au.currency || '') + Number(n).toLocaleString();
          const box = el(
            'section',
            { className: 'poll' },
            el('p', { className: 'event', textContent: au.title || 'Auction' }),
            el('h1', { textContent: it.name, dir: 'auto' }),
          );
          if (it.detail) box.append(el('p', { className: 'note', textContent: it.detail, dir: 'auto' }));
          const mineTop = it.top !== null && myBids[it.id] === it.top && it.topName === typed.name.trim();
          if (it.sold) {
            box.append(
              el('p', { className: 'big', textContent: 'Sold for ' + money(it.top) }),
              el('p', { textContent: (mineTop ? 'You won! Mazel tov! 🎉' : 'to ' + (it.topName || 'Anonymous')) + ' — the next item is coming.' }),
            );
          } else {
            box.append(
              el('p', { className: 'note', textContent: it.top === null ? 'Starting bid' : 'Current bid' }),
              el('p', { className: 'big', textContent: money(it.top === null ? it.min : it.top) }),
            );
            if (it.top !== null)
              box.append(
                el('p', { className: mineTop ? 'winning' : '', textContent: mineTop ? "You're the highest bidder! 🎉" : 'by ' + (it.topName || 'Anonymous') }),
              );
            if (it.endsAt) {
              const t = el('p', { className: 'timer' });
              timers.push([t, it.endsAt]);
              box.append(t);
            }
            box.append(nameBox());
            const quick = el('button', { className: 'send', textContent: 'Bid ' + money(it.min) });
            quick.onclick = () => placeBid(au, it.min);
            const more = el('input', {
              type: 'number',
              inputMode: 'numeric',
              min: it.min,
              placeholder: 'Or type more (' + money(it.min) + ' or more)',
              value: typed.bid,
            });
            more.oninput = () => (typed.bid = more.value);
            const go = el('button', { textContent: 'Bid this amount' });
            go.onclick = () => placeBid(au, Math.floor(Number(typed.bid)));
            box.append(quick, more, go, el('p', { className: 'note', textContent: bidNote || 'A bid is a promise to pay if you win.' }));
          }
          app.append(box);
        }
        tickTimers();
        for (const w of walls) {
          const text = el('textarea', { placeholder: 'Your message', value: typed.wall, maxLength: 280, dir: 'auto' });
          text.oninput = () => (typed.wall = text.value);
          const box = el('section', { className: 'poll' }, el('h1', { textContent: w.prompt || w.title || 'Send a message', dir: 'auto' }), nameBox(), text);
          if (w.photos) {
            if (photo) {
              const img = el('img', { src: photoUrl, className: 'photo', alt: '' });
              const off = el('button', { textContent: 'Remove the photo' });
              off.onclick = () => {
                setPhoto(null);
                last = '';
                load();
              };
              box.append(img, off);
            } else {
              const pick = el('input', { type: 'file', accept: 'image/*', className: 'file', id: 'photo-' + w.id });
              pick.onchange = async () => {
                const f = pick.files && pick.files[0];
                if (f) setPhoto(await shrink(f));
                if (document.activeElement) document.activeElement.blur();
                last = '';
                load();
              };
              box.append(el('label', { className: 'pick', htmlFor: 'photo-' + w.id, textContent: '📷 Add a photo' }), pick);
            }
          }
          const send = el('button', { className: 'send', textContent: sending ? 'Sending…' : 'Send', disabled: sending });
          send.onclick = () => sendMessage(w);
          box.append(send, el('p', { className: 'note', textContent: wallNote || 'The hosts choose what goes on screen.' }));
          app.append(box);
        }
        if (a.questions) {
          const q = el('textarea', { placeholder: 'Your question', value: typed.question, maxLength: 300 });
          q.oninput = () => (typed.question = q.value);
          const send = el('button', { className: 'send', textContent: 'Send the question' });
          send.onclick = () => askIt();
          app.append(
            el(
              'section',
              { className: 'poll' },
              el('h1', { textContent: 'Ask a question' }),
              nameBox(),
              q,
              send,
              el('p', { className: 'note', textContent: sentNote || 'The hosts choose which questions go on screen.' }),
            ),
          );
        }
      }

      const joined = {};
      typed.amount = '';
      typed.message = '';
      let pledgeNote = '';

      async function enter(r) {
        const name = typed.name.trim();
        if (!name) return alert('Please type your name first.');
        try {
          const res = await fetch('/api/raffle', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: r.id, name, voter }),
          });
          if (!res.ok) throw new Error();
          joined[r.id] = name;
        } catch {
          alert('It did not go through — try again.');
        }
        last = '';
        load();
      }

      async function pledgeIt(f) {
        const amount = Math.floor(Number(typed.amount));
        if (!(amount > 0)) return alert('Please type an amount.');
        try {
          const res = await fetch('/api/pledge', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: f.id, name: typed.name.trim(), amount, message: typed.message.trim(), voter }),
          });
          if (res.status === 429) pledgeNote = 'Please wait a few seconds before pledging again.';
          else if (!res.ok) throw new Error();
          else {
            pledgeNote = 'Thank you for your pledge of ' + (f.currency || '') + amount.toLocaleString() + '!';
            typed.amount = '';
            typed.message = '';
          }
        } catch {
          pledgeNote = 'It did not go through — try again.';
        }
        if (document.activeElement) document.activeElement.blur();
        last = '';
        load();
      }

      typed.wall = '';
      typed.bid = '';
      const myBids = {};
      let bidNote = '';
      let clockOffset = 0;
      const timers = [];

      function tickTimers() {
        const now = Date.now() + clockOffset;
        for (const [t, end] of timers) {
          const s = Math.max(0, Math.ceil((end - now) / 1000));
          t.textContent = s > 0 ? '⏱ ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') + ' left' : 'Time is up';
          t.classList.toggle('late', s <= 10);
        }
      }
      setInterval(tickTimers, 500);

      typed.seat = '';
      let seatTimer = 0;
      async function findSeat(st, box) {
        const out = box.querySelector('.seats');
        const name = typed.seat.trim();
        if (name.length < 2) {
          out.textContent = '';
          return;
        }
        try {
          const r = await fetch('/api/seat?id=' + encodeURIComponent(st.id) + '&name=' + encodeURIComponent(name), { cache: 'no-store' });
          const list = r.ok ? await r.json() : [];
          out.textContent = '';
          if (!list.length) out.append(el('p', { className: 'note', textContent: 'No one by that name yet — try your family name.' }));
          for (const g of list)
            out.append(el('p', { className: 'seat', dir: 'auto' }, el('span', { textContent: g.name }), el('b', { textContent: 'Table ' + g.table })));
        } catch {
          out.textContent = 'It did not load — try again.';
        }
      }

      async function answerIt(g, option) {
        try {
          await fetch('/api/answer', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: g.id, question: g.question, option, name: typed.name.trim() || 'Player', voter }),
          });
        } catch {
          // The next refresh shows whether it counted.
        }
        last = '';
        load();
      }

      async function placeBid(au, amount) {
        const name = typed.name.trim();
        if (!name) return alert('Please type your name first.');
        if (!(amount >= au.item.min)) return alert('The bid must be at least ' + (au.currency || '') + au.item.min.toLocaleString() + '.');
        if (!confirm('Bid ' + (au.currency || '') + amount.toLocaleString() + ' on ' + au.item.name + '?')) return;
        try {
          const r = await fetch('/api/bid', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: au.id, item: au.item.id, name, amount, voter }),
          });
          if (r.ok) {
            myBids[au.item.id] = amount;
            typed.bid = '';
            bidNote = 'Your bid of ' + (au.currency || '') + amount.toLocaleString() + ' is in!';
          } else {
            const why = (await r.json().catch(() => ({}))).reason;
            bidNote = why ? 'Not taken: ' + why + '.' : 'It did not go through — try again.';
          }
        } catch {
          bidNote = 'It did not go through — try again.';
        }
        if (document.activeElement) document.activeElement.blur();
        last = '';
        load();
      }
      let wallNote = '';
      let photo = null;
      let photoUrl = '';
      let sending = false;

      function setPhoto(blob) {
        if (photoUrl) URL.revokeObjectURL(photoUrl);
        photo = blob;
        photoUrl = blob ? URL.createObjectURL(blob) : '';
      }

      // Photos are made smaller on the phone (quicker to send, easy on the venue network).
      async function shrink(file) {
        try {
          const url = URL.createObjectURL(file);
          const img = await new Promise((ok, fail) => {
            const i = new Image();
            i.onload = () => ok(i);
            i.onerror = fail;
            i.src = url;
          });
          URL.revokeObjectURL(url);
          const scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
          const c = document.createElement('canvas');
          c.width = Math.round(img.naturalWidth * scale);
          c.height = Math.round(img.naturalHeight * scale);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          return await new Promise((ok) => c.toBlob(ok, 'image/jpeg', 0.85));
        } catch {
          alert('That picture could not be opened — try another.');
          return null;
        }
      }

      async function sendMessage(w) {
        const text = typed.wall.trim();
        if (!text && !photo) return alert('Please write a message' + (w.photos ? ' or add a photo.' : '.'));
        const q = new URLSearchParams({ id: w.id, voter, name: typed.name.trim(), text });
        sending = true;
        last = '';
        load();
        try {
          const r = await fetch('/api/message?' + q, { method: 'POST', headers: { 'Content-Type': 'image/jpeg' }, body: photo || '' });
          if (r.status === 429) wallNote = 'Please wait a few seconds before sending another.';
          else if (!r.ok) throw new Error();
          else {
            typed.wall = '';
            setPhoto(null);
            wallNote = 'Thank you — your message was sent!';
          }
        } catch {
          wallNote = 'It did not send — try again.';
        }
        sending = false;
        if (document.activeElement) document.activeElement.blur();
        last = '';
        load();
      }

      async function askIt() {
        const text = typed.question.trim();
        if (!text) return;
        try {
          const r = await fetch('/api/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ author: typed.name.trim(), text, voter }),
          });
          if (r.status === 429) sentNote = 'Please wait a few seconds before sending another question.';
          else if (!r.ok) throw new Error();
          else {
            typed.question = '';
            sentNote = 'Thank you — your question was sent.';
          }
        } catch {
          sentNote = 'It did not send — try again.';
        }
        if (document.activeElement) document.activeElement.blur();
        last = '';
        load();
      }

      async function load() {
        try {
          const r = await fetch('/api/audience?voter=' + encodeURIComponent(voter), { cache: 'no-store' });
          if (r.ok) draw(await r.json());
        } catch {
          // The venue network dropped for a moment; try again.
        }
      }

      async function vote(poll, option) {
        const k = poll.id + ':' + poll.round;
        const before = mine[k];
        mine[k] = option;
        load();
        try {
          const r = await fetch('/api/vote', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: poll.id, round: poll.round, option, voter }),
          });
          if (!r.ok) throw new Error();
        } catch {
          mine[k] = before;
          last = '';
          load();
        }
      }

      load();
      setInterval(load, 2000);
    </script>
  </body>
</html>
