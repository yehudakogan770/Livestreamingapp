[package]
name = "lumora"
description = "Lumora — live event control for three screens"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "lumora_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lumora-engine = { path = "../crates/engine" }
lumora-crash = { path = "../crates/crash" }
lumora-selftest = { path = "../crates/selftest" }
lumora-syscheck = { path = "../crates/syscheck" }
lumora-testevent = { path = "../crates/testevent" }
lumora-live-engine = { path = "../crates/live-engine" }
# Blackmagic capture cards and ATEM switchers.
lumora-decklink = { path = "../crates/decklink" }
lumora-atem = { path = "../crates/atem" }
tauri = { version = "2", features = ["protocol-asset"] }
serde.workspace = true
serde_json.workspace = true
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tiny_http = "0.12"
if-addrs = "0.15"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
jpeg-encoder = "0.7"
png = "0.18"
libloading = "0.8"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
# Google Sheets and CSV links for the data file (the same client the updater uses).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Web page inputs are captured with the Windows Graphics Capture API.
[target.'cfg(windows)'.dependencies]
windows-capture = "2"

[lints.rust]
# Only ndi.rs (the NDI library is C) may use unsafe, with a reason each time.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
