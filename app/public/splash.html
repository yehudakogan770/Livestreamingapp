<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lumora</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #15171b;
        color: #e4e5e7;
        font-family: 'Segoe UI', system-ui, sans-serif;
        overflow: hidden;
        user-select: none;
        cursor: default;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        border: 1px solid #2c3038;
        box-sizing: border-box;
      }
      .mark {
        width: 76px;
        height: 76px;
      }
      .mark .blades {
        transform-origin: 24px 24px;
        animation: turn 2.4s cubic-bezier(0.6, 0, 0.4, 1) infinite;
      }
      .mark circle {
        animation: glow 1.2s ease-in-out infinite alternate;
      }
      h1 {
        margin: 0;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      p {
        margin: 0;
        font-size: 13px;
        color: #a9abb0;
      }
      .bar {
        position: relative;
        width: 180px;
        height: 3px;
        border-radius: 2px;
        background: #262a31;
        overflow: hidden;
      }
      .bar::before {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        width: 40%;
        border-radius: 2px;
        background: #4fb3bf;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes turn {
        to {
          transform: rotate(120deg);
        }
      }
      @keyframes glow {
        from {
          opacity: 0.55;
        }
      }
      @keyframes slide {
        from {
          left: -40%;
        }
        to {
          left: 100%;
        }
      }
    </style>
  </head>
  <body>
    <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
      <g class="blades">
        <path d="M25.65 3.06 A21 21 0 0 1 42.95 33.04 L29.01 33.23 A10.5 10.5 0 0 0 30.82 16.02 Z" fill="#4fb3bf" />
        <path d="M41.31 35.89 A21 21 0 0 1 6.69 35.89 L13.50 23.73 A10.5 10.5 0 0 0 27.50 33.90 Z" fill="#d6d8dc" />
        <path d="M5.05 33.04 A21 21 0 0 1 22.35 3.06 L29.49 15.05 A10.5 10.5 0 0 0 13.68 22.09 Z" fill="#8f949c" />
      </g>
      <circle cx="24" cy="24" r="5.6" fill="#e0473b" />
    </svg>
    <h1>Lumora</h1>
    <div class="bar" role="progressbar" aria-label="Loading"></div>
    <p>Loading…</p>
  </body>
</html>
