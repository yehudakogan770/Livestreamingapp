<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lumora</title>
    <style>
      @font-face {
        font-family: 'Sora';
        font-weight: 100 800;
        src: url('fonts/sora/latin-100-800.woff2') format('woff2');
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        user-select: none;
        cursor: default;
      }
      body {
        position: relative;
        background:
          radial-gradient(420px 260px at 0% 100%, rgba(79, 179, 191, 0.22), transparent 70%),
          radial-gradient(320px 220px at 100% 0%, rgba(224, 71, 59, 0.12), transparent 70%), linear-gradient(160deg, #15171c, #0b0c0f 60%);
        color: #f1efeb;
        font-family: 'Segoe UI', system-ui, sans-serif;
        border: 1px solid #2c3038;
      }
      /* A fine line of light along the top. */
      body::before {
        content: '';
        position: absolute;
        inset: 0 0 auto;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(143, 211, 219, 0.8), transparent);
      }
      .main {
        position: absolute;
        left: 44px;
        top: 70px;
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .mark {
        width: 92px;
        height: 92px;
        overflow: visible;
      }
      /* The iris closes: each blade swings in from outside and settles. */
      .blade {
        transform-origin: 24px 24px;
        animation: blade 1s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .blade:nth-child(1) {
        --from: rotate(-70deg) translate(6px, -10px);
      }
      .blade:nth-child(2) {
        --from: rotate(-70deg) translate(0, 12px);
        animation-delay: 0.08s;
      }
      .blade:nth-child(3) {
        --from: rotate(-70deg) translate(-12px, -4px);
        animation-delay: 0.16s;
      }
      @keyframes blade {
        from {
          opacity: 0;
          transform: var(--from);
        }
      }
      /* The red centre lights up like an on-air light, then glows. */
      .live {
        transform-origin: 24px 24px;
        animation:
          on 0.4s 0.75s ease-out both,
          glow 1.4s 1.2s ease-in-out infinite alternate;
      }
      @keyframes on {
        from {
          opacity: 0;
          transform: scale(0.3);
        }
      }
      @keyframes glow {
        to {
          filter: drop-shadow(0 0 6px rgba(255, 80, 64, 0.9));
        }
      }
      .name {
        animation: rise 0.8s 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .name b {
        display: block;
        font-family: 'Sora', 'Segoe UI', sans-serif;
        font-weight: 600;
        font-size: 50px;
        line-height: 1;
        letter-spacing: -0.03em;
      }
      .name span {
        display: block;
        margin-top: 8px;
        font-size: 15px;
        letter-spacing: 0.02em;
        color: #9a9ca3;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateX(-10px);
        }
      }
      .foot {
        position: absolute;
        left: 44px;
        right: 44px;
        bottom: 34px;
      }
      .status {
        position: relative;
        height: 18px;
        margin-bottom: 12px;
        font-size: 13px;
        color: #c6c5c1;
      }
      .status span {
        position: absolute;
        inset: 0;
        opacity: 0;
        animation: say 0.9s ease both;
      }
      .status span:nth-child(1) {
        animation-delay: 0.3s;
      }
      .status span:nth-child(2) {
        animation-delay: 1.1s;
      }
      .status span:nth-child(3) {
        animation:
          say 0.9s 1.9s ease both,
          stay 1s 2.6s forwards;
      }
      @keyframes say {
        0% {
          opacity: 0;
          transform: translateY(6px);
        }
        25%,
        75% {
          opacity: 1;
          transform: none;
        }
        100% {
          opacity: 0;
          transform: translateY(-6px);
        }
      }
      @keyframes stay {
        to {
          opacity: 1;
          transform: none;
        }
      }
      .bar {
        position: relative;
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .bar i {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        border-radius: 2px;
        background: linear-gradient(90deg, #2c8f9b, #8fd3db);
        box-shadow: 0 0 12px rgba(143, 211, 219, 0.6);
        animation: fill 2.4s 0.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      /* If it takes longer, the bar keeps gently moving at the end. */
      .bar::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        width: 30%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
        animation: sheen 1.4s 2.6s linear infinite;
        opacity: 0;
      }
      @keyframes fill {
        to {
          width: 100%;
        }
      }
      @keyframes sheen {
        from {
          left: -30%;
          opacity: 1;
        }
        to {
          left: 100%;
          opacity: 1;
        }
      }
      .meta {
        display: flex;
        justify-content: space-between;
        margin-top: 12px;
        font-size: 11px;
        color: #6f727a;
        letter-spacing: 0.04em;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01s !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="main">
      <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
        <g>
          <path class="blade" d="M25.65 3.06 A21 21 0 0 1 42.95 33.04 L29.01 33.23 A10.5 10.5 0 0 0 30.82 16.02 Z" fill="#4fb3bf" />
          <path class="blade" d="M41.31 35.89 A21 21 0 0 1 6.69 35.89 L13.50 23.73 A10.5 10.5 0 0 0 27.50 33.90 Z" fill="#d6d8dc" />
          <path class="blade" d="M5.05 33.04 A21 21 0 0 1 22.35 3.06 L29.49 15.05 A10.5 10.5 0 0 0 13.68 22.09 Z" fill="#8f949c" />
        </g>
        <circle class="live" cx="24" cy="24" r="5.6" fill="#e0473b" />
      </svg>
      <div class="name">
        <b>Lumora</b>
        <span>Live production studio</span>
      </div>
    </div>
    <div class="foot">
      <div class="status" role="status">
        <span>Starting the engine…</span>
        <span>Loading your event…</span>
        <span>Getting the screens ready…</span>
      </div>
      <div class="bar" role="progressbar" aria-label="Loading"><i></i></div>
      <div class="meta"><span>LIVE · STREAM · RECORD</span><span>© Lumora</span></div>
    </div>
  </body>
</html>
