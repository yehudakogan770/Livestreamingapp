<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body {
    font-family: 'Inter', 'Segoe UI', 'DejaVu Sans', sans-serif;
    background: #f6f4f0;
    color: #14202b;
    position: relative;
  }
  .band { position: absolute; left: 0; top: 0; bottom: 0; width: 18px; background: #1f6f7a; }
  .top { position: absolute; left: 130px; top: 96px; right: 130px; display: flex; justify-content: space-between; align-items: center; font-size: 26px; letter-spacing: 0.14em; text-transform: uppercase; color: #5a6670; font-weight: 600; }
  .brand { display: flex; align-items: center; gap: 18px; color: #14202b; letter-spacing: 0.08em; }
  .brand i { width: 0; height: 0; border-left: 17px solid transparent; border-right: 17px solid transparent; border-bottom: 34px solid #1f6f7a; display: inline-block; }
  
  h1 { position: absolute; left: 130px; top: 250px; margin: 0; font-size: 104px; line-height: 1.04; font-weight: 800; letter-spacing: -0.02em; max-width: 1300px; }
  h1 span { color: #1f6f7a; }
  .sub { position: absolute; left: 134px; top: 500px; font-size: 38px; color: #4c5862; max-width: 1200px; line-height: 1.35; }
  .stats { position: absolute; left: 130px; right: 130px; bottom: 120px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 60px; }
  .stat { border-top: 4px solid #14202b; padding-top: 26px; }
  .stat b { display: block; font-size: 92px; font-weight: 800; letter-spacing: -0.02em; }
  .stat span { font-size: 30px; color: #5a6670; }
  .stat:first-child { border-color: #1f6f7a; }
  .stat:first-child b { color: #1f6f7a; }
  .pg { position: absolute; right: 130px; bottom: 50px; font-size: 22px; color: #8a949c; }
</style>
</head>
<body>
  <div class="band"></div>
  <div class="top"><span class="brand"><i></i>Northwind Summit 2026</span><span>Keynote · The year ahead</span></div>
  <h1>One platform.<br /><span>Every team.</span></h1>
  <p class="sub">What we shipped this year, and what comes next for the 4,000 teams who build on Northwind.</p>
  <div class="stats">
    <div class="stat"><b>2.4M</b><span>weekly active users</span></div>
    <div class="stat"><b>38</b><span>countries, up from 21 last year</span></div>
    <div class="stat"><b>99.98%</b><span>uptime across all regions</span></div>
  </div>
  <div class="pg">07</div>
</body>
</html>
