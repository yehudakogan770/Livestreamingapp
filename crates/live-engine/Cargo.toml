[package]
name = "lumora-live-engine"
description = "Lumora's unified live engine (beta): opens each input once, composites every screen once on the GPU and feeds every output"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "live_engine"

[dev-dependencies]
jpeg-encoder = "0.7"

[[bin]]
name = "live-bench"
path = "src/bin/live-bench.rs"

[dependencies]
lumora-engine = { path = "../engine" }
serde.workspace = true
serde_json.workspace = true
pollster = "1"
# Pictures from stream, web page, screen-capture and guest inputs arrive as JPEG (or PNG when see-through).
zune-jpeg = "0.4"
png = "0.17"

# Direct3D 12 on Windows (the target), Vulkan or OpenGL elsewhere (tests and development), Metal on macOS.
# The same wgpu as crates/studio-engine, so the app carries one copy.
[target.'cfg(windows)'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "naga-ir", "dx12"] }
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }
# Cameras through Media Foundation (what the WebView's getUserMedia uses underneath).
# Zero-copy encoding (zerocopy_win.rs): Direct3D 12 textures shared with Direct3D 11 and
# the graphics card's Media Foundation encoder; DXGI for the displays' graphics cards.
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
] }

[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "naga-ir", "metal"] }

[target.'cfg(not(any(windows, target_vendor = "apple")))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "naga-ir", "vulkan", "gles"] }

[lints.rust]
# Only the Windows modules (Win32 windows, Media Foundation) use unsafe, each with a SAFETY note.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
