[package]
name = "lumora-vst3-host"
description = "Lumora Studio's VST3 host: finds the VST3 plug-ins installed on the computer, opens one, lists and sets its parameters, saves and restores its state, and runs sound through it offline"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
libloading = "0.8"

# A plug-in's own window on Windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
# Only the COM layer (com.rs, objects.rs, module.rs, plugin.rs) uses unsafe, each with a SAFETY note.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
