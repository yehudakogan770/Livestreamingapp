[package]
name = "lumora-syscheck"
description = "The system check for Lumora and Lumora Studio: what this computer has (Windows, processor, memory, graphics, drives, FFmpeg). The apps judge it."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
