[package]
name = "lumora-studio-engine"
description = "Lumora Studio's native playback engine: decodes and composites the program monitor on the GPU"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "studio_engine"

[dependencies]
# The editor's GLSL is translated by naga (the same version wgpu uses).
naga = { version = "30", features = ["glsl-in", "wgsl-in"] }
serde.workspace = true
serde_json.workspace = true
rmp-serde = "1.3"
pollster = "1"
raw-window-handle = "0.6"

# Direct3D 12 on Windows (the target), Vulkan or OpenGL elsewhere (tests and development), Metal on macOS.
[target.'cfg(windows)'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "naga-ir", "dx12"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "naga-ir", "metal"] }

[target.'cfg(not(any(windows, target_vendor = "apple")))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "naga-ir", "vulkan", "gles"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
