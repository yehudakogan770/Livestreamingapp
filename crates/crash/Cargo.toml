[package]
name = "lumora-crash"
description = "Crash notes for Lumora and Lumora Studio: a panic is written down (cleaned) for an opt-in error report next time."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
