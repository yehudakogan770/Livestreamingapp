[package]
name = "lumora-decklink"
description = "Blackmagic DeckLink, UltraStudio and Intensity capture and playout through the DeckLink API of Blackmagic Desktop Video (installed by the user): devices, format detection, video, embedded audio, timecode"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true

# The DeckLink API is COM on Windows (Blackmagic Desktop Video registers it).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Ole",
] }
windows-core = "0.62"

[lints.rust]
# Only the COM module (com.rs, capture.rs, output.rs on Windows) uses unsafe, each with a SAFETY note.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
