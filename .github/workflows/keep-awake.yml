# Supabase's free plan pauses a project after a week with no activity, and then
# nobody can sign in. This asks the database a tiny question every few days so
# that never happens. It uses the public (publishable) key that is already in
# the apps; it reads nothing private.
name: Keep the account server awake

on:
  schedule:
    - cron: '23 9 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the account server a question
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            "https://vtlrrhctnwktnaxtdopz.supabase.co/rest/v1/rpc/sign_ups_open" \
            -H "apikey: sb_publishable_SW15wnTjCrTapvBZxXA5qg_E94To1FF" \
            -H "Content-Type: application/json" -d '{}')
          echo "Answered $code"
          test "$code" = 200
