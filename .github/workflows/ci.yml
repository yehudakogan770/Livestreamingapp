name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for the app window
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: npm ci
      - name: UI type check
        run: npm run typecheck
      - name: UI tests
        run: npm test
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Rust lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace

  windows:
    name: Windows installer
    runs-on: windows-latest
    needs: checks
    env:
      # Each build is a new version, so the app's Update button sees it.
      LUMORA_VERSION: 0.1.${{ github.run_number }}
      # Signs the update so the app only installs real Lumora updates
      # (a repository secret; without it the installer is still made).
      SIGNING_KEY_AS_PASTED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: ffmpeg-cache
          key: ffmpeg-win64-7.1-v1
      - run: npm ci
      - name: Engine tests on Windows
        run: cargo test --workspace
      - name: Version, signing and FFmpeg
        shell: bash
        run: scripts/ci-windows.sh src-tauri/tauri.conf.json src-tauri
      - name: Build the installer
        run: npm run build
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Lumora-Setup-windows
          path: |
            target/release/bundle/nsis/Lumora_*.exe
            target/release/bundle/nsis/Lumora_*.sig
          if-no-files-found: error

  windows-edit:
    name: Lumora Edit installer
    runs-on: windows-latest
    needs: checks
    env:
      LUMORA_VERSION: 0.1.${{ github.run_number }}
      SIGNING_KEY_AS_PASTED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: ffmpeg-cache
          key: ffmpeg-win64-7.1-v1
      - run: npm ci
      - name: Version, signing and FFmpeg
        shell: bash
        run: scripts/ci-windows.sh editor/src-tauri/tauri.conf.json editor/src-tauri
      - name: Build the installer
        run: npm run edit:build
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Lumora-Edit-Setup-windows
          path: |
            target/release/bundle/nsis/Lumora Edit_*.exe
            target/release/bundle/nsis/Lumora Edit_*.sig
          if-no-files-found: error

  release:
    name: Public download and update
    runs-on: ubuntu-latest
    needs: [windows, windows-edit]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/festive-curie-637ic2')
    permissions:
      contents: write
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Lumora-Setup-windows
          path: lumora
      - uses: actions/download-artifact@v4
        with:
          name: Lumora-Edit-Setup-windows
          path: edit
      # Names that never change, so the website's download links always work.
      - name: Name the installers, and say where the updates are
        run: |
          mkdir -p out
          publish() { # folder, installer name, update file, notes
            local sig exe
            sig=$(ls "$1"/*.sig 2>/dev/null | head -1 || true)
            exe=$(ls "$1"/*.exe | head -1)
            mv "$exe" "out/$2"
            if [ -n "$sig" ]; then
              jq -n --arg v "$VERSION" --arg s "$(cat "$sig")" \
                --arg u "https://github.com/${{ github.repository }}/releases/download/v$VERSION/$2" \
                --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg n "$4" \
                '{version: $v, notes: $n, pub_date: $d, platforms: {"windows-x86_64": {signature: $s, url: $u}}}' > "out/$3"
            fi
          }
          publish lumora Lumora-Setup.exe latest.json "A new version of Lumora."
          publish edit Lumora-Edit-Setup.exe latest-edit.json "A new version of Lumora Edit."
          ls -la out
      - name: Publish it (anyone can download, no account)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Lumora ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            out/Lumora-Setup.exe
            out/Lumora-Edit-Setup.exe
            out/latest*.json
          body: |
            Lumora for Windows 10 and 11 (64-bit). Download Lumora-Setup.exe and run it.
            Lumora Edit (for editing recorded events): download Lumora-Edit-Setup.exe.
            Already have Lumora? Use Help → Check for updates in the app.
            The first time, Windows may say it doesn't recognize the app: click More info, then Run anyway.
