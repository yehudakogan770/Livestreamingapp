name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for the app window
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: npm ci
      - name: UI type check
        run: npm run typecheck
      - name: UI tests
        run: npm test
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Rust lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace

  windows:
    name: Windows installer
    runs-on: windows-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Engine tests on Windows
        run: cargo test --workspace
      - name: Build the installer
        run: npm run build
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Lumora-Setup-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Public download
    runs-on: ubuntu-latest
    needs: windows
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/festive-curie-637ic2')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Lumora-Setup-windows
          path: out
      # One name that never changes, so the website's download link always works.
      - name: Name the installer
        run: |
          mv out/*.exe out/Lumora-Setup.exe
          echo "VERSION=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_ENV"
      - name: Publish it (anyone can download, no account)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Lumora ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/Lumora-Setup.exe
          body: |
            Lumora for Windows 10 and 11 (64-bit). Download Lumora-Setup.exe and run it.
            The first time, Windows may say it doesn't recognise the app: click More info, then Run anyway.
