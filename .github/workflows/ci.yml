name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for the app window
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: npm ci
      - name: UI type check
        run: npm run typecheck
      - name: UI tests
        run: npm test
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Rust lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace

  windows:
    name: Windows installer
    runs-on: windows-latest
    needs: checks
    env:
      # Each build is a new version, so the app's Update button sees it.
      LUMORA_VERSION: 0.1.${{ github.run_number }}
      # Signs the update so the app only installs real Lumora updates
      # (a repository secret; without it the installer is still made).
      SIGNING_KEY_AS_PASTED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Engine tests on Windows
        run: cargo test --workspace
      - name: Set the version (and signing)
        shell: bash
        run: |
          # Spaces, line breaks or quotes picked up when pasting the key are
          # removed; a key that still can't be read builds without signing.
          key=$(printf '%s' "$SIGNING_KEY_AS_PASTED" | tr -d " \t\r\n\"'=")
          # The "=" at the end is easy to miss when copying: put it back.
          while [ $(( ${#key} % 4 )) -ne 0 ]; do key="$key="; done
          # A hint for fixing a bad paste (never the key itself): a good key
          # is 348 characters and starts with "dW50cnVzdGVk".
          echo "Signing key: ${#key} characters, starts like a key: $([ "${key:0:12}" = dW50cnVzdGVk ] && echo yes || echo no)"
          # A test signing with Tauri's own tool proves the key works.
          echo test > "$RUNNER_TEMP/sign-test.txt"
          if [ -n "$key" ] && TAURI_SIGNING_PRIVATE_KEY="$key" npx tauri signer sign "$RUNNER_TEMP/sign-test.txt" > /dev/null 2>&1; then
            echo "TAURI_SIGNING_PRIVATE_KEY=$key" >> "$GITHUB_ENV"
            echo "Signing key OK."
          else
            [ -n "$SIGNING_KEY_AS_PASTED" ] && echo "::warning::The TAURI_SIGNING_PRIVATE_KEY secret can't be read; building without update signing."
            echo "LUMORA_NO_SIGNING=1" >> "$GITHUB_ENV"
          fi
          node -e "
            const fs = require('fs');
            const f = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(f, 'utf8'));
            c.version = process.env.LUMORA_VERSION;
            fs.writeFileSync(f, JSON.stringify(c, null, 2));
          "
      - name: No signing key, so no update files
        if: env.LUMORA_NO_SIGNING == '1'
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const f = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(f, 'utf8'));
            c.bundle.createUpdaterArtifacts = false;
            fs.writeFileSync(f, JSON.stringify(c, null, 2));
          "
      - name: Build the installer
        run: npm run build
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Lumora-Setup-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sig
          if-no-files-found: error

  release:
    name: Public download and update
    runs-on: ubuntu-latest
    needs: windows
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/festive-curie-637ic2')
    permissions:
      contents: write
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Lumora-Setup-windows
          path: out
      # One name that never changes, so the website's download link always works.
      - name: Name the installer, and say where the update is
        run: |
          sig=$(ls out/*.sig 2>/dev/null | head -1 || true)
          mv "$(ls out/*.exe | head -1)" out/Lumora-Setup.exe
          if [ -n "$sig" ]; then
            jq -n --arg v "$VERSION" --arg s "$(cat "$sig")" \
              --arg u "https://github.com/${{ github.repository }}/releases/download/v$VERSION/Lumora-Setup.exe" \
              --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{version: $v, notes: "A new version of Lumora.", pub_date: $d, platforms: {"windows-x86_64": {signature: $s, url: $u}}}' > out/latest.json
            rm "$sig"
          fi
          ls -la out
      - name: Publish it (anyone can download, no account)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Lumora ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            out/Lumora-Setup.exe
            out/latest.json
          body: |
            Lumora for Windows 10 and 11 (64-bit). Download Lumora-Setup.exe and run it.
            Already have Lumora? Use Help → Check for updates in the app.
            The first time, Windows may say it doesn't recognize the app: click More info, then Run anyway.
