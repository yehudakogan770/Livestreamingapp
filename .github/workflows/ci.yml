name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for the app window
        # A stuck package mirror once hung this step for over an hour: give up
        # quickly and try again instead.
        timeout-minutes: 15
        run: |
          for i in 1 2 3; do
            timeout 300 sudo apt-get update -o Acquire::Retries=3 &&
              timeout 600 sudo apt-get install -y -o Acquire::Retries=3 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev && break
            echo "Package install failed (try $i), retrying"
            sleep 10
          done
      - run: npm ci
      - name: UI type check
        run: npm run typecheck
      - name: UI tests
        run: npm test
      # The website serves the Planner from docs/planner (GitHub Pages, from
      # the repository): it is built here and must match what is committed.
      - name: Lumora Planner build (docs/planner is up to date)
        run: |
          npm run planner:build
          if [ -n "$(git status --porcelain -- docs/planner)" ]; then
            git status --short -- docs/planner
            echo "::error::docs/planner is out of date: run npm run planner:build and commit docs/planner"
            exit 1
          fi
      # The website serves Lumora Titler from docs/titler the same way.
      - name: Lumora Titler build (docs/titler is up to date)
        run: |
          npm run titler:build
          if [ -n "$(git status --porcelain -- docs/titler)" ]; then
            git status --short -- docs/titler
            echo "::error::docs/titler is out of date: run npm run titler:build and commit docs/titler"
            exit 1
          fi
      - name: Stream Deck plugin builds
        run: npm run streamdeck:pack
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Rust lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace

  windows:
    name: Windows installer
    runs-on: windows-latest
    needs: checks
    env:
      # Each build is a new version, so the app's Update button sees it.
      LUMORA_VERSION: 0.1.${{ github.run_number }}
      # Signs the update so the app only installs real Lumora updates
      # (a repository secret; without it the installer is still made).
      SIGNING_KEY_AS_PASTED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      # Going live with a connected YouTube or Facebook account (docs/LIVE_ACCOUNTS.md):
      # the owner's Google "Desktop app" OAuth client and Meta app ID, from the
      # repository's Actions variables. Not secrets (a desktop app can't keep
      # them); left empty, the installer is still made and the Connect buttons
      # say the feature isn't set up yet.
      LUMORA_YT_CLIENT_ID: ${{ vars.LUMORA_YT_CLIENT_ID }}
      LUMORA_YT_CLIENT_SECRET: ${{ vars.LUMORA_YT_CLIENT_SECRET || secrets.LUMORA_YT_CLIENT_SECRET }}
      LUMORA_FB_APP_ID: ${{ vars.LUMORA_FB_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: ffmpeg-cache
          key: ffmpeg-win64-7.1-v1
      - run: npm ci
      - name: Engine tests on Windows
        run: cargo test --workspace
      - name: Version, signing and FFmpeg
        shell: bash
        run: scripts/ci-windows.sh src-tauri/tauri.conf.json src-tauri
      # Lumora carries its Stream Deck buttons and offers them when it finds a Stream Deck:
      # packed before the installer is built, so it can go inside.
      - name: Stream Deck plugin (inside the installer)
        shell: bash
        run: npm run streamdeck:pack -- --app src-tauri/tauri.conf.json
      - name: Build the installer
        run: npm run build
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Lumora-Setup-windows
          path: |
            target/release/bundle/nsis/Lumora_*.exe
            target/release/bundle/nsis/Lumora_*.sig
          if-no-files-found: error
      - name: Upload the Stream Deck plugin
        uses: actions/upload-artifact@v4
        with:
          name: Lumora-StreamDeck-plugin
          path: streamdeck/dist/com.lumora.streamdeck.streamDeckPlugin
          if-no-files-found: error

  windows-edit:
    name: Lumora Studio installer
    runs-on: windows-latest
    needs: checks
    env:
      LUMORA_VERSION: 0.1.${{ github.run_number }}
      SIGNING_KEY_AS_PASTED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: ffmpeg-cache
          key: ffmpeg-win64-7.1-v1
      - run: npm ci
      - name: Version, signing and FFmpeg
        shell: bash
        run: scripts/ci-windows.sh editor/src-tauri/tauri.conf.json editor/src-tauri
      - name: Build the installer
        run: npm run edit:build
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Lumora-Studio-Setup-windows
          path: |
            target/release/bundle/nsis/Lumora Studio_*.exe
            target/release/bundle/nsis/Lumora Studio_*.sig
          if-no-files-found: error

  windows-titler:
    name: Lumora Titler installer
    runs-on: windows-latest
    needs: checks
    env:
      LUMORA_VERSION: 0.1.${{ github.run_number }}
      SIGNING_KEY_AS_PASTED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: ffmpeg-cache
          key: ffmpeg-win64-7.1-v1
      - run: npm ci
      - name: Version, signing and FFmpeg
        shell: bash
        run: scripts/ci-windows.sh titler/src-tauri/tauri.conf.json titler/src-tauri
      - name: Build the installer
        run: npm run titler:app:build
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Lumora-Titler-Setup-windows
          path: |
            target/release/bundle/nsis/Lumora Titler_*.exe
            target/release/bundle/nsis/Lumora Titler_*.sig
          if-no-files-found: error

  # The real programs, started and run through on Windows (e2e/run.mjs). It
  # runs after the installers are made and reports (job summary, results in
  # the e2e-results artifact), but never blocks a release: nothing needs it,
  # and it may fail without failing the run.
  #   1. The installers from the jobs above: installed, they start and keep
  #      running (and ignore LUMORA_SELFTEST: they have no self-test).
  #   2. Test builds made here with VITE_LUMORA_E2E=1, which skips the sign-in
  #      and carries an in-app self-test (app/src/e2e.ts, app/src/selftest/):
  #      started with LUMORA_SELFTEST=<file>, each runs its steps in the page,
  #      writes the results to that file and closes. No WebDriver is needed.
  #      They are never uploaded or shipped; the installers are built without
  #      it, so people can't skip the sign-in or run the self-test.
  e2e:
    name: End-to-end smoke tests (Windows)
    runs-on: windows-latest
    needs: [windows, windows-edit]
    continue-on-error: true
    timeout-minutes: 120
    env:
      LUMORA_VERSION: 0.1.${{ github.run_number }}
      # The test builds don't ship: build them quicker.
      CARGO_PROFILE_RELEASE_LTO: 'off'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - uses: actions/cache@v4
        with:
          path: ffmpeg-cache
          key: ffmpeg-win64-7.1-v1
      - run: npm ci

      - name: Download the installers
        uses: actions/download-artifact@v4
        with:
          name: Lumora-Setup-windows
          path: installers/lumora
      - uses: actions/download-artifact@v4
        with:
          name: Lumora-Studio-Setup-windows
          path: installers/studio
      - name: Install them (silently, as an administrator would)
        shell: pwsh
        run: |
          foreach ($p in @(@('lumora', 'LUMORA_INSTALLED', 'Lumora'), @('studio', 'STUDIO_INSTALLED', 'Lumora Studio'))) {
            $setup = Get-ChildItem "installers/$($p[0])" -Filter *.exe | Select-Object -First 1
            Write-Host "Installing $($setup.Name)"
            Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
            $dirs = @("$env:ProgramFiles\$($p[2])", "$env:LOCALAPPDATA\Programs\$($p[2])", "$env:LOCALAPPDATA\$($p[2])")
            $exe = Get-ChildItem $dirs -Filter *.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -notmatch '^(uninstall|ffmpeg)' } | Select-Object -First 1
            if ($exe) { "$($p[1])=$($exe.FullName)" >> $env:GITHUB_ENV; Write-Host "Installed: $($exe.FullName)" }
            else { Write-Host "::warning::$($p[2]) was not found after installing" }
          }

      - name: Get the test builds ready (version, FFmpeg)
        shell: bash
        run: |
          scripts/ci-windows.sh src-tauri/tauri.conf.json src-tauri
          scripts/ci-windows.sh editor/src-tauri/tauri.conf.json editor/src-tauri
      - name: Make the test builds (no sign-in, with the self-test; never shipped)
        shell: bash
        env:
          VITE_LUMORA_E2E: '1'
        run: |
          npx tauri build --no-bundle
          (cd editor && npx tauri build --no-bundle)
          ls -la target/release/*.exe
          studio=$(ls "target/release/Lumora Studio.exe" target/release/lumora-edit.exe 2>/dev/null | head -1 || true)
          echo "LUMORA_TEST=$(cygpath -w "$PWD/target/release/lumora.exe")" >> "$GITHUB_ENV"
          echo "STUDIO_TEST=$(cygpath -w "$PWD/$studio")" >> "$GITHUB_ENV"

      - name: Demo media for Lumora Studio
        shell: bash
        run: |
          ffmpeg=$(cygpath -w "$PWD/ffmpeg-cache/ffmpeg.exe")
          media=$(cygpath -w "$RUNNER_TEMP/demo-media")
          FFMPEG="$ffmpeg" node e2e/make-media.mjs "$media"
          echo "FFMPEG=$ffmpeg" >> "$GITHUB_ENV"
          echo "E2E_MEDIA=$media" >> "$GITHUB_ENV"

      - name: Run the smoke tests (installed start-up, then the test builds' self-tests)
        shell: bash
        run: node e2e/run.mjs
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e/results
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Public download and update
    runs-on: ubuntu-latest
    needs: [windows, windows-edit, windows-titler]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/festive-curie-637ic2')
    permissions:
      contents: write
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Lumora-Setup-windows
          path: lumora
      - uses: actions/download-artifact@v4
        with:
          name: Lumora-Studio-Setup-windows
          path: edit
      - uses: actions/download-artifact@v4
        with:
          name: Lumora-Titler-Setup-windows
          path: titler
      # The Stream Deck plugin, built by the Lumora installer job (the same one the installer carries).
      - uses: actions/download-artifact@v4
        with:
          name: Lumora-StreamDeck-plugin
          path: streamdeck
      # Names that never change, so the website's download links always work.
      - name: Name the installers, and say where the updates are
        run: |
          mkdir -p out
          publish() { # folder, installer name, update file, notes
            local sig exe
            sig=$(ls "$1"/*.sig 2>/dev/null | head -1 || true)
            exe=$(ls "$1"/*.exe | head -1)
            mv "$exe" "out/$2"
            if [ -n "$sig" ]; then
              jq -n --arg v "$VERSION" --arg s "$(cat "$sig")" \
                --arg u "https://github.com/${{ github.repository }}/releases/download/v$VERSION/$2" \
                --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg n "$4" \
                '{version: $v, notes: $n, pub_date: $d, platforms: {"windows-x86_64": {signature: $s, url: $u}}}' > "out/$3"
            fi
          }
          publish lumora Lumora-Setup.exe latest.json "A new version of Lumora."
          publish edit Lumora-Studio-Setup.exe latest-edit.json "A new version of Lumora Studio."
          publish titler Lumora-Titler-Setup.exe latest-titler.json "A new version of Lumora Titler."
          cp streamdeck/com.lumora.streamdeck.streamDeckPlugin out/Lumora.streamDeckPlugin
          ls -la out
      - name: Publish it (anyone can download, no account)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Lumora ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            out/Lumora-Setup.exe
            out/Lumora-Studio-Setup.exe
            out/Lumora-Titler-Setup.exe
            out/Lumora.streamDeckPlugin
            out/latest*.json
          body: |
            Lumora for Windows 10 and 11 (64-bit). Download Lumora-Setup.exe and run it.
            Lumora Studio (for editing recorded events): download Lumora-Studio-Setup.exe.
            Lumora Titler (motion graphics for Lumora and Studio): download Lumora-Titler-Setup.exe.
            Stream Deck plugin: download Lumora.streamDeckPlugin and double-click it (Lumora also offers it when it finds a Stream Deck).
            Already have Lumora? Use Help → Check for updates in the app.
            The first time, Windows may say it doesn't recognize the app: click More info, then Run anyway.
