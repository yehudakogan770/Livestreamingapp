<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumora — Hype countdown</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#15171b;font-family:'Segoe UI',system-ui,sans-serif;color:#e4e5e7}
a{color:#4fb3bf}a:hover{color:#8fd3db}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
input[type=range],input[type=checkbox]{accent-color:#4fb3bf}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #15171b; display: flex; flex-direction: column; font-family: 'Segoe UI', system-ui, sans-serif; color: #e4e5e7; overflow: hidden;">

  <div style="height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 14px; padding: 0 24px; background: #1a1d22; border-bottom: 1px solid #2c3038;">
    <span style="font-size: 20px; font-weight: 600;">Hype countdown</span>
    <span style="font-size: 13px; color: #8e9096;">A big countdown to something exciting — for the Back Screen and the live stream</span>
    <div style="flex-grow: 1;"></div>
    <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #d4d5d8;"><input type="checkbox" checked="{{onBack}}" onChange="{{toggleBack}}"> Back Screen</label>
    <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #d4d5d8;"><input type="checkbox" checked="{{onLive}}" onChange="{{toggleLive}}"> Live stream</label>
    <a href="Main.dc.html" aria-label="Close" style="width: 36px; height: 36px; margin-left: 8px; border-radius: 6px; border: 1px solid #2c3038; background: #2a2e36; color: #e4e5e7; display: flex; align-items: center; justify-content: center; text-decoration: none;"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M2.5 2.5l9 9M11.5 2.5l-9 9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></svg></a>
  </div>

  <div style="flex-grow: 1; min-height: 0; display: flex;">

    <!-- Preview + live controls -->
    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; padding: 20px 24px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="width: 8px; height: 8px; border-radius: 2px; background: #3fbf5a;"></span>
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #d4d5d8;">PREVIEW</span>
        <span style="font-size: 12px; color: #8e9096;">{{previewNote}}</span>
        <div style="flex-grow: 1;"></div>
        <button onClick="{{toggleFinal}}" style="{{finalBtnStyle}}">Preview final 10 seconds</button>
      </div>

      <div style="{{stage}}">
        <div style="{{glowLayer}}"></div>
        <sc-if value="{{notFinal}}" hint-placeholder-val="{{true}}">
          <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;">
            <span style="{{titleStyle}}">{{title}}</span>
            <span style="{{digitsStyle}}">{{digits}}</span>
            <span style="{{subStyle}}">{{subtitle}}</span>
          </div>
          <div style="position: absolute; left: 64px; right: 64px; bottom: 34px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.12);"><div style="{{progressBar}}"></div></div>
        </sc-if>
        <sc-if value="{{isFinal}}" hint-placeholder-val="{{false}}">
          <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;">
            <span style="{{finalStyle}}">10</span>
          </div>
          <span style="position: absolute; left: 0; right: 0; bottom: 40px; text-align: center; font-size: 14px; font-weight: 700; letter-spacing: 0.3em; color: rgba(255,255,255,0.7);">GET READY</span>
        </sc-if>
      </div>

      <!-- Live control bar -->
      <div style="display: flex; align-items: center; gap: 8px; padding: 12px; border-radius: 8px; background: #1e2127; border: 1px solid #2c3038;">
        <button onClick="{{toggleRun}}" style="{{runStyle}}">{{runLabel}}</button>
        <button onClick="{{reset}}" style="height: 44px; padding: 0 16px; border-radius: 6px; border: 1px solid #2c3038; background: #2a2e36; color: #e4e5e7; font-size: 13px; font-weight: 600;">Reset</button>
        <span style="width: 1px; height: 30px; background: #2c3038; margin: 0 4px;"></span>
        <span style="font-size: 10px; font-weight: 700; color: #8e9096; letter-spacing: 0.08em;">ADD TIME LIVE</span>
        <button onClick="{{sub1}}" style="height: 44px; padding: 0 14px; border-radius: 6px; border: 1px solid #2c3038; background: #2a2e36; color: #e4e5e7; font-size: 13px; font-weight: 600;">−1 min</button>
        <button onClick="{{add1}}" style="height: 44px; padding: 0 14px; border-radius: 6px; border: 1px solid #2c3038; background: #2a2e36; color: #e4e5e7; font-size: 13px; font-weight: 600;">+1 min</button>
        <button onClick="{{add5}}" style="height: 44px; padding: 0 14px; border-radius: 6px; border: 1px solid #2c3038; background: #2a2e36; color: #e4e5e7; font-size: 13px; font-weight: 600;">+5 min</button>
        <button onClick="{{jump10}}" style="height: 44px; padding: 0 14px; border-radius: 6px; border: 1px solid #2c3038; background: #2a2e36; color: #e4e5e7; font-size: 13px; font-weight: 600;">Jump to last 10 s</button>
        <div style="flex-grow: 1;"></div>
        <button style="height: 44px; padding: 0 18px; border-radius: 6px; border: 0; background: #c7372f; color: #ffffff; font-size: 13px; font-weight: 700; letter-spacing: 0.04em;">Send to screens</button>
      </div>

      <!-- Count down to -->
      <div style="display: flex; gap: 12px;">
        <div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 8px; background: #1e2127; border: 1px solid #2c3038;">
          <span style="font-size: 10px; font-weight: 700; color: #8e9096; letter-spacing: 0.08em;">COUNT DOWN TO</span>
          <div style="display: flex; gap: 6px;">
            <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
              <button onClick="{{m.pick}}" style="{{m.style}}">{{m.name}}</button>
            </sc-for>
          </div>
          <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #a9abb0;">
            <sc-if value="{{byTime}}" hint-placeholder-val="{{true}}">Starts at <input value="20:00" aria-label="Time of day" style="width: 80px; height: 32px; text-align: center; border-radius: 6px; border: 1px solid #2c3038; background: #101216; color: #ffffff; font-family: Consolas, monospace; font-size: 15px;"></sc-if>
            <sc-if value="{{byLength}}" hint-placeholder-val="{{false}}">Length <input value="05:00" aria-label="Countdown length" style="width: 80px; height: 32px; text-align: center; border-radius: 6px; border: 1px solid #2c3038; background: #101216; color: #ffffff; font-family: Consolas, monospace; font-size: 15px;"></sc-if>
            <span style="flex-grow: 1;"></span>
            Format <select style="height: 32px; border-radius: 6px; border: 1px solid #2c3038; background: #262a31; color: #e4e5e7; font-size: 12px;"><option>mm:ss</option><option>hh:mm:ss</option><option>Seconds only (last minute)</option></select>
          </div>
        </div>
        <div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 8px; background: #1e2127; border: 1px solid #2c3038;">
          <span style="font-size: 10px; font-weight: 700; color: #8e9096; letter-spacing: 0.08em;">WHEN IT HITS ZERO</span>
          <select aria-label="At zero" style="height: 32px; border-radius: 6px; border: 1px solid #2c3038; background: #262a31; color: #e4e5e7; font-size: 13px;"><option>Play video: Opening.mp4 → then Camera 1</option><option>Switch to Camera 1</option><option>Show text: "Welcome!"</option><option>Run preset: Opening</option><option>Go to black</option></select>
          <div style="display: flex; gap: 14px; font-size: 12px; color: #d4d5d8;">
            <label style="display: flex; align-items: center; gap: 6px;"><input type="checkbox" checked="{{true}}"> Confetti burst</label>
            <label style="display: flex; align-items: center; gap: 6px;"><input type="checkbox" checked="{{true}}"> Horn / impact sound</label>
          </div>
        </div>
      </div>
    </div>

    <!-- Style panel -->
    <div style="width: 400px; flex-shrink: 0; display: flex; flex-direction: column; gap: 18px; padding: 20px; box-sizing: border-box; background: #1a1d22; border-left: 1px solid #2c3038; overflow: hidden;">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 10px; font-weight: 700; color: #8e9096; letter-spacing: 0.08em;">STYLE</span>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;">
          <sc-for list="{{styles}}" as="s" hint-placeholder-count="6">
            <button onClick="{{s.pick}}" style="{{s.style}}"><span style="{{s.swatch}}"><span style="font-family: Consolas, monospace; font-size: 14px; font-weight: 800; color: #ffffff;">00:10</span></span><span style="font-size: 11px; font-weight: 600;">{{s.name}}</span></button>
          </sc-for>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 10px; font-weight: 700; color: #8e9096; letter-spacing: 0.08em;">TEXT</span>
        <input aria-label="Title above the numbers" value="{{title}}" onInput="{{onTitle}}" style="height: 34px; padding: 0 10px; border-radius: 6px; border: 1px solid #2c3038; background: #101216; color: #ffffff; font-size: 13px;">
        <input aria-label="Line under the numbers" value="{{subtitle}}" onInput="{{onSub}}" style="height: 34px; padding: 0 10px; border-radius: 6px; border: 1px solid #2c3038; background: #101216; color: #ffffff; font-size: 13px;">
        <div style="display: flex; gap: 6px;">
          <select aria-label="Font" style="flex-grow: 1; height: 32px; border-radius: 6px; border: 1px solid #2c3038; background: #262a31; color: #e4e5e7; font-size: 12px;"><option>Bahnschrift Bold</option><option>Impact</option><option>Segoe UI Black</option><option>Frank Ruhl Libre</option><option>+ Import font…</option></select>
          <select aria-label="Number colour" style="width: 110px; height: 32px; border-radius: 6px; border: 1px solid #2c3038; background: #262a31; color: #e4e5e7; font-size: 12px;"><option>White</option><option>Event colour</option><option>Custom…</option></select>
        </div>
        <label style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: #a9abb0;">Size<input type="range" min="80" max="220" value="{{size}}" onInput="{{onSize}}" style="flex-grow: 1;"></label>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 10px; font-weight: 700; color: #8e9096; letter-spacing: 0.08em;">BACKGROUND</span>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;">
          <sc-for list="{{bgs}}" as="b" hint-placeholder-count="8">
            <button onClick="{{b.pick}}" aria-label="{{b.name}}" style="{{b.style}}"><span style="font-size: 9px; color: rgba(255,255,255,0.8);">{{b.name}}</span></button>
          </sc-for>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 10px; font-weight: 700; color: #8e9096; letter-spacing: 0.08em;">HYPE EFFECTS</span>
        <sc-for list="{{effects}}" as="e" hint-placeholder-count="6">
          <label style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #d4d5d8;"><input type="checkbox" checked="{{e.on}}" onChange="{{e.toggle}}">{{e.name}}</label>
        </sc-for>
        <label style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: #a9abb0;">Music<select style="flex-grow: 1; height: 30px; border-radius: 6px; border: 1px solid #2c3038; background: #262a31; color: #e4e5e7; font-size: 12px;"><option>Build-up track (rises to zero)</option><option>Use stage audio</option><option>None</option></select></label>
      </div>

      <div style="flex-grow: 1;"></div>
      <button style="height: 40px; border-radius: 6px; border: 1px solid #2c3038; background: #2a2e36; color: #e4e5e7; font-size: 13px; font-weight: 600;">Save countdown to library</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      secs: 299, total: 300, running: true, final: false, mode: 'time',
      style: 'cinematic', bg: 'particles', size: 150,
      title: 'THE SHOW BEGINS IN', subtitle: '[Event name]',
      onBack: true, onLive: true,
      fx: { pulse: true, beat: true, glow: true, zoom10: true, shake: false, tick: true }
    };
  }
  renderVals() {
    const st = this.state;
    const set = (p) => this.setState(p);
    const STYLES = {
      cinematic: { name: 'Cinematic', accent: '#e8e2d4', bg: '#0e1116' },
      neon: { name: 'Neon pulse', accent: '#4fb3bf', bg: '#07161a' },
      festive: { name: 'Festive', accent: '#f0c86a', bg: '#1a1208' },
      bold: { name: 'Bold red', accent: '#ff5a4f', bg: '#170909' },
      clean: { name: 'Clean', accent: '#ffffff', bg: '#15171b' },
      royal: { name: 'Royal', accent: '#b9a4ff', bg: '#100c1e' }
    };
    const BG = { particles: ['Particles', '#1c2440'], aurora: ['Aurora', '#153230'], stars: ['Stars', '#0b0f1c'], smoke: ['Smoke', '#23262c'], glow: ['Warm glow', '#3a2616'], lights: ['Stage lights', '#241a33'], logo: ['Event logo', '#2b2518'], color: ['Colour', '#000000'] };
    const sty = STYLES[st.style];
    const mm = Math.floor(st.secs / 60), ss = st.secs % 60;
    const styles = Object.entries(STYLES).map(([id, s]) => ({
      name: s.name,
      pick: () => set({ style: id }),
      style: `padding: 6px; display: flex; flex-direction: column; gap: 6px; border-radius: 6px; border: 2px solid ${st.style === id ? '#4fb3bf' : '#2c3038'}; background: #1e2127; color: #e4e5e7; align-items: stretch;`,
      swatch: `height: 44px; border-radius: 4px; background: ${s.bg}; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 1px ${s.accent}33;`
    }));
    const bgs = Object.entries(BG).map(([id, [name, tone]]) => ({
      name,
      pick: () => set({ bg: id }),
      style: `height: 50px; border-radius: 6px; border: 2px solid ${st.bg === id ? '#4fb3bf' : '#2c3038'}; background: ${tone}; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px;`
    }));
    const FX = [['pulse', 'Numbers pulse every second'], ['beat', 'Background moves to the music'], ['glow', 'Glow around numbers'], ['zoom10', 'Last 10 seconds: huge numbers zoom in'], ['shake', 'Camera-shake on each of the last 10 seconds'], ['tick', 'Tick sound in the last 10 seconds']];
    const effects = FX.map(([id, name]) => ({ name, on: !!st.fx[id], toggle: () => set({ fx: { ...st.fx, [id]: !st.fx[id] } }) }));
    const modes = [['time', 'A time of day'], ['length', 'A length of time']].map(([id, name]) => ({
      name, pick: () => set({ mode: id }),
      style: `flex-grow: 1; height: 32px; border-radius: 6px; border: 1px solid ${st.mode === id ? '#4fb3bf' : '#2c3038'}; background: ${st.mode === id ? '#1d3b40' : '#2a2e36'}; color: ${st.mode === id ? '#dff4f6' : '#d4d5d8'}; font-size: 12px; font-weight: 600;`
    }));
    const glow = st.fx.glow ? `0 0 40px ${sty.accent}66, 0 0 90px ${sty.accent}33` : 'none';
    const pct = Math.max(0, Math.min(100, (1 - st.secs / st.total) * 100));
    return {
      styles, bgs, effects, modes,
      byTime: st.mode === 'time', byLength: st.mode === 'length',
      title: st.title, subtitle: st.subtitle,
      onTitle: (e) => set({ title: e.target.value }),
      onSub: (e) => set({ subtitle: e.target.value }),
      size: st.size, onSize: (e) => set({ size: Number(e.target.value) }),
      digits: `${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`,
      isFinal: st.final, notFinal: !st.final,
      toggleFinal: () => set({ final: !st.final }),
      finalBtnStyle: `height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid ${st.final ? '#4fb3bf' : '#2c3038'}; background: ${st.final ? '#1d3b40' : '#2a2e36'}; color: ${st.final ? '#dff4f6' : '#d4d5d8'}; font-size: 12px; font-weight: 600;`,
      previewNote: `${sty.name} · ${BG[st.bg][0]} background · ${[st.onBack && 'Back Screen', st.onLive && 'Live stream'].filter(Boolean).join(' + ') || 'no screen selected'}`,
      stage: `position: relative; height: 520px; border-radius: 8px; overflow: hidden; border: 1px solid #2f8f4e; background: ${BG[st.bg][1]};`,
      glowLayer: `position: absolute; inset: 0; background: radial-gradient(ellipse at center, ${sty.accent}22 0%, transparent 60%); opacity: ${st.fx.glow ? 1 : 0};`,
      titleStyle: `font-size: 20px; font-weight: 700; letter-spacing: 0.35em; color: ${sty.accent}; opacity: 0.85;`,
      digitsStyle: `font-family: Bahnschrift, 'Segoe UI', sans-serif; font-size: ${st.size}px; font-weight: 800; line-height: 1; letter-spacing: 0.02em; color: #ffffff; text-shadow: ${glow}; font-variant-numeric: tabular-nums;`,
      subStyle: `font-size: 22px; font-weight: 600; color: rgba(255,255,255,0.75);`,
      finalStyle: `font-family: Bahnschrift, 'Segoe UI', sans-serif; font-size: 360px; font-weight: 900; line-height: 1; color: ${sty.accent}; text-shadow: ${glow};`,
      progressBar: `position: absolute; left: 0; top: 0; bottom: 0; width: ${pct}%; border-radius: 2px; background: ${sty.accent};`,
      toggleRun: () => set({ running: !st.running }),
      runLabel: st.running ? '❚❚  Pause' : '▶  Start',
      runStyle: `height: 44px; min-width: 120px; padding: 0 18px; border-radius: 6px; border: 0; background: ${st.running ? '#343944' : '#2f8f4e'}; color: #ffffff; font-size: 14px; font-weight: 700;`,
      reset: () => set({ secs: st.total, running: false, final: false }),
      add1: () => set({ secs: st.secs + 60, total: st.total + 60 }),
      add5: () => set({ secs: st.secs + 300, total: st.total + 300 }),
      sub1: () => set({ secs: Math.max(0, st.secs - 60) }),
      jump10: () => set({ secs: 10, final: true }),
      onBack: st.onBack, onLive: st.onLive,
      toggleBack: () => set({ onBack: !st.onBack }),
      toggleLive: () => set({ onLive: !st.onLive })
    };
  }
}
</script>
</body>
</html>
