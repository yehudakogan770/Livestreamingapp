<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumora — Phone as camera</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
button{cursor:pointer;background-image:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.12));box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
body{margin:0;background:#000;font-family:'Segoe UI',system-ui,sans-serif;color:#e4e5e7}
a{color:#7fb2ec}a:hover{color:#a9cbf3}
button{font-family:inherit}
input[type=range]{accent-color:#e8b04b}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000; position: relative; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; color: #e4e5e7;">
  <sc-if value="{{setup}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; inset: 0; background-color: #223329; display: flex; align-items: center; justify-content: center;"><span style="font-size: 18px; color: rgba(255,255,255,0.35);">Camera view</span></div>
    <div style="{{tally}}"></div>
    <div style="position: absolute; left: 14px; right: 14px; top: 16px; display: flex; align-items: center; gap: 8px;">
      <span style="height: 30px; padding: 0 12px; border-radius: 4px; background: rgba(0,0,0,0.55); display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600;"><span style="width: 8px; height: 8px; border-radius: 4px; background-color: #2c8a3e;"></span>Camera 3 · Crowd</span>
      <div style="flex-grow: 1;"></div>
      <button onClick="{{toggleAir}}" style="{{airStyle}}">{{airText}}</button>
    </div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 16px 24px; background: rgba(8,9,11,0.88); display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; gap: 8px;">
        <button style="flex-grow: 1; height: 40px; border-radius: 4px; border: 1px solid #111214; background-color: #3c3d42; color: #e4e5e7; font-size: 13px;">Flip camera</button>
        <button style="flex-grow: 1; height: 40px; border-radius: 4px; border: 1px solid #111214; background-color: #3c3d42; color: #e4e5e7; font-size: 13px;">1080p · 30</button>
        <button style="flex-grow: 1; height: 40px; border-radius: 4px; border: 1px solid #111214; background-color: #3c3d42; color: #e4e5e7; font-size: 13px;">Lock focus</button>
      </div>
      <label style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #a9abb0;">Zoom<input type="range" min="1" max="5" step="0.1" value="1.4" style="flex-grow: 1;"></label>
      <label style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #a9abb0;">Exposure<input type="range" min="-2" max="2" step="0.1" value="0" style="flex-grow: 1;"></label>
      <div style="display: flex; justify-content: space-between; font-family: Consolas, monospace; font-size: 11px; color: #8e9096;"><span>Signal 18 ms</span><span>Battery 64%</span><span>Plugged in: no</span></div>
      <button onClick="{{goBlack}}" style="height: 56px; border-radius: 4px; border: 0; background-color: #e8b04b; color: #20180a; font-size: 16px; font-weight: 700;">Black screen (keep filming)</button>
    </div>
  </sc-if>
  <sc-if value="{{black}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; background: #000;"></div>
    <button onClick="{{showControls}}" aria-label="Show camera controls" style="position: absolute; right: 16px; bottom: 28px; width: 44px; height: 44px; border-radius: 4px; border: 1px solid #1e1e1e; background-color: #070707; color: #3a3a3a; font-size: 18px;">•••</button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { black: false, onAir: true }; }
  renderVals() {
    const st = this.state;
    return {
      setup: !st.black,
      black: st.black,
      goBlack: () => this.setState({ black: true }),
      showControls: () => this.setState({ black: false }),
      toggleAir: () => this.setState({ onAir: !st.onAir }),
      airText: st.onAir ? 'ON AIR' : 'Standby',
      airStyle: `height: 30px; padding: 0 12px; border-radius: 4px; border: 0; background-color: ${st.onAir ? '#b8322a' : 'rgba(0,0,0,0.55)'}; color: #fff; font-size: 12px; font-weight: 700; letter-spacing: 0.06em;`,
      tally: `position: absolute; inset: 0; border: 4px solid ${st.onAir ? '#b8322a' : 'transparent'}; box-sizing: border-box; pointer-events: none;`
    };
  }
}
</script>
</body>
</html>
