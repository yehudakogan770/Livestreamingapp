<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumora — Phone as camera</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Sora:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#e6e8eb}
a{color:#f2b84b}a:hover{color:#ffd27a}
button{font-family:inherit}
input[type=range]{accent-color:#f2b84b}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000; position: relative; overflow: hidden; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #e6e8eb;">
  <sc-if value="{{setup}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; inset: 0; background: #223329; display: flex; align-items: center; justify-content: center;"><span style="font-family: Sora, sans-serif; font-size: 18px; color: rgba(255,255,255,0.35);">Camera view</span></div>
    <div style="{{tally}}"></div>
    <div style="position: absolute; left: 14px; right: 14px; top: 16px; display: flex; align-items: center; gap: 8px;">
      <span style="height: 30px; padding: 0 12px; border-radius: 15px; background: rgba(0,0,0,0.55); display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600;"><span style="width: 8px; height: 8px; border-radius: 4px; background: #30a46c;"></span>Camera 3 · Crowd</span>
      <div style="flex-grow: 1;"></div>
      <button onClick="{{toggleAir}}" style="{{airStyle}}">{{airText}}</button>
    </div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 16px 24px; background: rgba(8,9,11,0.88); display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; gap: 8px;">
        <button style="flex-grow: 1; height: 40px; border-radius: 9px; border: 1px solid #2f343a; background: #17191c; color: #e6e8eb; font-size: 13px;">Flip camera</button>
        <button style="flex-grow: 1; height: 40px; border-radius: 9px; border: 1px solid #2f343a; background: #17191c; color: #e6e8eb; font-size: 13px;">1080p · 30</button>
        <button style="flex-grow: 1; height: 40px; border-radius: 9px; border: 1px solid #2f343a; background: #17191c; color: #e6e8eb; font-size: 13px;">Lock focus</button>
      </div>
      <label style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #aab0b8;">Zoom<input type="range" min="1" max="5" step="0.1" value="1.4" style="flex-grow: 1;"></label>
      <label style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #aab0b8;">Exposure<input type="range" min="-2" max="2" step="0.1" value="0" style="flex-grow: 1;"></label>
      <div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8d949e;"><span>Signal 18 ms</span><span>Battery 64%</span><span>Plugged in: no</span></div>
      <button onClick="{{goBlack}}" style="height: 56px; border-radius: 12px; border: 0; background: #f2b84b; color: #1a1408; font-size: 16px; font-weight: 700;">Black screen (keep filming)</button>
    </div>
  </sc-if>
  <sc-if value="{{black}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; background: #000;"></div>
    <button onClick="{{showControls}}" aria-label="Show camera controls" style="position: absolute; right: 16px; bottom: 28px; width: 44px; height: 44px; border-radius: 22px; border: 1px solid #1e1e1e; background: #070707; color: #3a3a3a; font-size: 18px;">•••</button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { black: false, onAir: true }; }
  renderVals() {
    const st = this.state;
    return {
      setup: !st.black,
      black: st.black,
      goBlack: () => this.setState({ black: true }),
      showControls: () => this.setState({ black: false }),
      toggleAir: () => this.setState({ onAir: !st.onAir }),
      airText: st.onAir ? 'ON AIR' : 'Standby',
      airStyle: `height: 30px; padding: 0 12px; border-radius: 15px; border: 0; background: ${st.onAir ? '#e5484d' : 'rgba(0,0,0,0.55)'}; color: #fff; font-size: 12px; font-weight: 700; letter-spacing: 0.06em;`,
      tally: `position: absolute; inset: 0; border: 4px solid ${st.onAir ? '#e5484d' : 'transparent'}; box-sizing: border-box; pointer-events: none;`
    };
  }
}
</script>
</body>
</html>
