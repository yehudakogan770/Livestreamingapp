<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumora — Singer view</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Sora:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0c0e;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#e6e8eb}
a{color:#f2b84b}a:hover{color:#ffd27a}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0b0c0e; display: flex; flex-direction: column; padding: 18px 16px; gap: 14px; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #e6e8eb; overflow: hidden;">
  <div style="display: flex; flex-direction: column; gap: 2px;">
    <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8d949e;">Playlist for the singer · view only</span>
    <span style="font-family: Sora, sans-serif; font-size: 20px; font-weight: 600;">[Event name]</span>
    <span style="font-size: 12px; color: #8d949e;">{{count}} songs · sent by the tech desk</span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px;">
    <sc-for list="{{songs}}" as="s" hint-placeholder-count="6">
      <div style="{{s.card}}">
        <button onClick="{{s.open}}" style="display: flex; align-items: center; gap: 12px; width: 100%; padding: 0; border: 0; background: transparent; color: inherit; text-align: left;">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #7f8791; width: 20px;">{{s.n}}</span>
          <span style="display: flex; flex-direction: column; flex-grow: 1;"><span style="font-size: 15px; font-weight: 600;">{{s.title}}</span><span style="font-size: 12px; color: #8d949e;">{{s.meta}}</span></span>
          <span style="font-size: 16px; color: #8d949e;">{{s.chev}}</span>
        </button>
        <sc-if value="{{s.isOpen}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; align-items: center; gap: 10px; padding: 10px; margin-top: 10px; border-radius: 9px; background: #0f1012; border: 1px solid #262a2f;">
            <button aria-label="Play song" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: #f2b84b; color: #1a1408; display: flex; align-items: center; justify-content: center;"><svg width="14" height="14" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.8l7 4.2-7 4.2z" fill="currentColor"></path></svg></button>
            <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #262a2f;"><div style="width: 30%; height: 4px; border-radius: 2px; background: #f2b84b;"></div></div>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8d949e;">{{s.len}}</span>
          </div>
          <div style="margin-top: 10px; padding: 10px 12px; border-radius: 9px; background: #1e1a10; border: 1px solid #4a3f24; font-size: 13px; color: #ffe3a6; line-height: 1.5;">{{s.note}}</div>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: 1 }; }
  renderVals() {
    const st = this.state;
    const LIST = [
      ['[Song 1]', 'Entrance · Key of D', '4:12', '[Your comment for this song — e.g. start after the video ends]'],
      ['[Song 2]', 'Slow · Key of Am', '5:03', '[Your comment for this song — e.g. only the first two verses]'],
      ['[Song 3]', 'Upbeat · Key of G', '3:48', '[Your comment]'],
      ['[Song 4]', 'Dance set', '6:20', '[Your comment]'],
      ['[Song 5]', 'Closing', '4:40', '[Your comment]']
    ];
    const songs = LIST.map(([title, meta, len, note], i) => {
      const isOpen = st.open === i;
      return {
        n: String(i + 1).padStart(2, '0'), title, meta, len, note, isOpen,
        chev: isOpen ? '−' : '+',
        open: () => this.setState({ open: isOpen ? -1 : i }),
        card: `padding: 12px; border-radius: 11px; background: #15171a; border: 1px solid ${isOpen ? '#4a3f24' : '#262a2f'};`
      };
    });
    return { songs, count: LIST.length };
  }
}
</script>
</body>
</html>
