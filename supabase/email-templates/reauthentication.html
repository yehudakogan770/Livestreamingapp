<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Your confirmation code</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f4f5f7">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #f4f5f7">
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            border="0"
            style="max-width: 520px; background-color: #ffffff; border: 1px solid #e3e5e8; border-radius: 8px"
          >
            <tr>
              <td style="padding: 20px 32px; background-color: #15171b; border-radius: 8px 8px 0 0">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td style="vertical-align: middle">
                      <img
                        src="https://lumoraproduction.com/img/lumora-mark-96.png"
                        width="32"
                        height="32"
                        alt=""
                        style="display: block; border: 0"
                      />
                    </td>
                    <td
                      style="
                        vertical-align: middle;
                        padding-left: 10px;
                        font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
                        font-size: 20px;
                        font-weight: 600;
                        color: #ffffff;
                      "
                    >
                      Lumora
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding: 32px; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.5; color: #1d2025">
                <h1 style="margin: 0 0 16px; font-size: 22px; font-weight: 600; color: #15171b">Your confirmation code</h1>
                <p style="margin: 0 0 16px">Type this code in Lumora to confirm it is you:</p>
                <p style="margin: 0 0 16px"><strong style="font-size: 24px; letter-spacing: 0.15em">{{ .Token }}</strong></p>
                <p style="margin: 0 0 16px">The code expires soon.</p>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 20px 32px;
                  border-top: 1px solid #e3e5e8;
                  font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
                  font-size: 13px;
                  line-height: 1.5;
                  color: #6b7079;
                "
              >
                Someone asked for a confirmation code for {{ .Email }}. If you did not ask for this, you can ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
