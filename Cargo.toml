[workspace]
resolver = "2"
members = ["crates/engine", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
authors = ["Lumora"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "10", features = ["serde-compat"] }

[profile.release]
lto = "thin"
codegen-units = 1
